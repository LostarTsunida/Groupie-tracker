<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artistes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Funnel+Sans:ital,wght@0,300..800;1,300..800&family=Lexend:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">

</head>

<body>

    <nav class="navbar">
        <div class="links-navbar">
            <a href="/">Accueil</a>
            <a href="/artists">Les artistes</a>
            <a href="/locations">Locations</a>
            <a href="/dates">Dates</a>
            <a href="/relation"> Relation</a>
        </div>
    </nav>

    <div class="product-container">
    {{range .}}
        <div class="product-card">
            <img src="{{.Image}}" alt="logo du groupe" class="product-card-image">
            <div class="product-card_details">
                <h2 class="product-card_title">{{.Name}}</h2>
            </div>
            <div>
                <button class="product-card_button" type="button">Locations</button>
                <button class="product-card_button" type="button">Dates</button>
                <button class="product-card_button" type="button">Relation</button>
            </div>
        </div>
    {{end}}
    </div>

    <footer>
        <span class="footer">© 2025 Groupie Trackers | Made with love by Mattéo.G & Loris.S | Projet étudiant Ynov Bordeaux 1ère année bachelor</span>
    </footer>

</body>
</html>
